function g(m, t, u) { var d = rankingData[m][t]; return d[u] !== undefined ? d[u] : undefined; }

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

function render() {
  const data = rankingData['8月'];
  const ranks = currentTab === 'strong' ? data.强县排名 : data.快县排名;
  const rkType = currentTab === 'strong' ? '强县排名' : '快县排名';
  
  // Overview cards
  const strongRank = g('8月', '强县排名', '深圳坪山');
  const fastRank = g('8月', '快县排名', '深圳坪山');
  
  document.getElementById('overviewCards').innerHTML = `
    <div class="card">
      <div class="card-title">强县排名</div>
      <div class="big-number rank-${strongRank <= 3 ? strongRank : 'other'}">#${strongRank}</div>
      <div class="trend">
        <div class="trend-item">5月 #${g('5月','强县排名','深圳坪山')}</div>

        <div class="trend-item">8月 #${strongRank}</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">快县排名</div>
      <div class="big-number rank-${fastRank <= 3 ? fastRank : 'other'}">#${fastRank}</div>
      <div class="trend">
        <div class="trend-item">5月 #${g('5月','快县排名','深圳坪山')}</div>
        <div class="trend-item">6月 #${g('6月','快县排名','深圳坪山')}</div>
        <div class="trend-item">7月 #${g('7月','快县排名','深圳坪山')}</div>
        <div class="trend-item">8月 #${fastRank}</div>
      </div>
    </div>

      <div class="card-title">综合评价</div>
      <div class="big-number" style="font-size: 32px; color: #10b981;">强快双优</div>
      <div style="margin-top: 8px; color: #a1a1aa; font-size: 14px;">
        强县第${strongRank}、快县第${fastRank}
      </div>
    </div>
  `;
  
  // Ranking table
  const tbody = document.querySelector('#rankingTable tbody');
  const allUnits = Object.keys(ranks).sort((a, b) => ranks[a] - ranks[b]);
  tbody.innerHTML = allUnits.map(unit => {
    const r5 = g('5月', rkType, unit) || '-';
    const r6 = g('6月', rkType, unit) || '-';
    const r7 = g('7月', rkType, unit) || '-';
    const r8 = ranks[unit];
    const isPingshan = unit.includes('坪山');
    const trend = r5 !== '-' && r8 !== '-' ? (r8 < r5 ? '↑' : r8 > r5 ? '↓' : '→') : '';
    return `<tr class="${isPingshan ? 'highlight' : ''}">
      <td>#${r8}</td>
      <td>${unit}</td>
      <td>#${r5}</td>
      <td>#${r6}</td>
      <td>#${r7}</td>
      <td>#${r8}</td>
      <td>${trend}</td>

  }).join('');
  
  // Indicator table
  const pingshanScores = scoresData['8月']['坪山'] || {};
  const indTbody = document.querySelector('#indicatorTable tbody');
  indTbody.innerHTML = Object.entries(indicators).map(([idx, [name, maxScore]]) => {
    const score = pingshanScores[idx] || 0;
    const rate = (score / maxScore * 100).toFixed(1);
    const badgeClass = rate >= 80 ? 'badge-gold' : rate >= 60 ? 'badge-green' : 'badge-red';

      <td>${name}</td>
      <td>${maxScore}</td>
      <td>${score.toFixed(2)}</td>

function renderChart() {

  const strongRanks = [
    g('5月','强县排名','深圳坪山'),

  ];
  
  if (window.trendChart) window.trendChart.destroy();
  
  window.trendChart = new Chart(ctx, {

    data: {
      labels: ['5月', '6月', '7月', '8月'],
      datasets: [
        {
          label: '强县排名',
          data: strongRanks,
          borderColor: '#f59e0b',

          borderColor: '#10b981',
          backgroundColor: 'rgba(16, 185, 129, 0.1)',
          tension: 0.3,
          yAxisID: 'y',
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: '#e4e4e7' } }
